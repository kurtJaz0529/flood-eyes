[pytest]
# 只从源码目录收集测试；产物目录里放的是调查脚本（例如
# outputs/release_v0.5.0/net_serve_test.py），文件名恰好匹配
# ``*_test.py``，pytest 会把它们当测试**导入**，于是顶层代码在收集阶段
# 就被执行——那个脚本会在导入时启动探针进程并等待端口文件，既慢又
# 会在探针产物被清理后直接报 FileNotFoundError 而中断整轮收集。
#
# 注意：这里显式写全，因为设置 norecursedirs 会**覆盖** pytest 的默认值
# （默认含 build / dist / .* / node_modules 等），漏写会把 dist 里的
# 第三方包也扫进来。
norecursedirs =
    .*
    build
    dist
    dist_full
    dist_dbg
    dist_dbg2
    dist_installer
    outputs
    node_modules
    venv
    env
    *.egg
    _darcs
    CVS
